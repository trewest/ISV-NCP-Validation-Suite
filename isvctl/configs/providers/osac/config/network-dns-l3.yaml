# OSAC Network DNS + L3 Routing Validation
#
# Validates localized DNS resolution and storage L3 routing on OCP
# using CoreDNS/K8s Services and OVN-Kubernetes pod networking.
#
# Implemented checks:
#   SDN06-01: LocalizedDnsCheck — DNS resolution via K8s Services
#   SDN08-01: StorageL3RoutingCheck — cross-subnet L3 routing via OVN
#
# Prerequisites:
#   - Multi-node OCP cluster with OVN-Kubernetes (>=2 worker nodes)
#   - KUBECONFIG set to the cluster kubeconfig
#
# Usage:
#   ISVTEST_INCLUDE_UNRELEASED=1 \
#   uv run isvctl test run -f isvctl/configs/providers/osac/config/network-dns-l3.yaml

import:
  - ../../../suites/network.yaml

version: "1.0"

commands:
  network:
    phases: ["test"]
    steps:
      - name: dns_test
        phase: test
        command: "python3 ../scripts/network/dns_test.py"
        timeout: 180
        continue_on_failure: true

      - name: storage_l3_routing
        phase: test
        command: "python3 ../scripts/network/storage_l3_routing_test.py"
        timeout: 180
        continue_on_failure: true

tests:
  cluster_name: "osac-network-dns-l3"
  description: "OSAC network: localized DNS and storage L3 routing"

  settings:
    region: "osac-default"

  exclude:
    labels:
      - "gpu"
      - "workload"
      - "slow"
