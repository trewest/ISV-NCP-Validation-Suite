# OSAC Network Validation Configuration
#
# Imports validations from the provider-agnostic network canonical config.
# This file provides OSAC-specific commands (fulfillment-service VirtualNetwork,
# Subnet, and SecurityGroup APIs).
#
# Ephemeral tenants are registered via the fulfillment-service Tenants
# gRPC API (not exposed on the REST gateway, so this requires the
# `grpcurl` CLI). Registration triggers osac-operator to auto-provision a
# matching Kubernetes Tenant CRD and labeled namespace within seconds.
# Fulfillment API calls then authenticate as the Kubernetes ServiceAccount
# in that namespace, not via Keycloak: the fulfillment-service gRPC server
# trusts the in-cluster Kubernetes API server as a JWT issuer and resolves
# the tenant from the SA token's `system:serviceaccount:<namespace>:<name>`
# subject. This sidesteps the Keycloak Organizations feature (which
# service accounts cannot join) that would otherwise be required to
# populate the `organization` JWT claim for regular Keycloak tokens.
#
# Currently implemented:
#   SDN01-01..04: VPC (VirtualNetwork) CRUD (VpcCrudCheck)
#   SDN02-01..04: SecurityGroup CRUD (SgCrudCheck)
#   SDN04-02:     VPC isolation (VpcIsolationCheck)
#   N/A:          Network provisioned (NetworkProvisionedCheck)
#   N/A:          Subnet configuration (SubnetConfigCheck)
#   N/A:          Security blocking (SecurityBlockingCheck)
#   SDN09-03:     SDN filter audit trail (SdnFilterAuditTrailCheck)
#                 — K8s audit log for SecurityGroup CRD mutations
#
# Deferred (need OCP pod connectivity probes — follow-up PR):
#   SDN02-05..09: SG scoping (workload/node/subnet/service)
#   SDN02-10:     SG port security policy
#   SDN02-08:     SG policy propagation timing
#
# bare_metal capability (launch_bm_instances setup step required):
#   N/A:        NetworkConnectivityCheck (connectivity_test)
#   SDN11-01:   StablePrivateIpCheck (stable_ip_test)
#   DMS05-01:   StableEgressIpCheck (stable_egress_ip_test)
#   N/A:        TrafficFlowCheck (traffic_validation)
#
# Not applicable to OSAC:
#   NET01-01, NET02-02: Physical fabric (BackendSwitchFabric, NvlinkDomain)
#   SDN08-01:   Storage L3 routing (physical storage network)
#   SDN09-01: SDN hardware fault logging (OCP Prometheus/AlertManager)
#   NET03-01:   BYOIP (not available in OSAC)
#   SDN05-01:   Floating IP (requires compute instances)
#   SDN06-01:   Localized DNS (not available in OSAC)
#   SDN07-01:   VPC peering (not available in OSAC)
#   IPAM01-01:  DHCP/IP management (requires SSH to instances)
#   IPAM02-01:  VPC IP config (VpcIpConfigCheck — DNS from CoreDNS, auto_assign_ip_mode=instance)
#
# Usage:
#   uv run isvctl test run -f isvctl/configs/providers/osac/config/network.yaml
#
# Required Environment Variables:
#   OSAC_KEYCLOAK_URL, OSAC_KEYCLOAK_REALM,
#   OSAC_ADMIN_CLIENT_ID, OSAC_ADMIN_CLIENT_SECRET (a Keycloak client with
#     fulfillment-service admin privileges — an "emergency service account"
#     per the gRPC server's --emergency-service-accounts flag. This is NOT
#     the ephemeral, Keycloak-realm-management-scoped client that
#     bootstrap_admin.py creates for other OSAC domains.)
#   OSAC_FULFILLMENT_GRPC_ADDRESS (host:port of the fulfillment gRPC server,
#     used to reach the Tenants API, which is not exposed on the REST
#     gateway)
#   Optional: OSAC_FULFILLMENT_URL, OSAC_VERIFY_SSL (default "true"),
#             OSAC_TENANT_NAMESPACE (default "osac-e2e-ci"),
#             ISVCTL_DEMO_MODE
#
# Requires the `grpcurl` CLI on PATH, and a kubectl/oc context with
# permission to get Tenant CRDs and mint ServiceAccount tokens in
# ephemeral tenant namespaces.

import:
  - ../../../suites/network.yaml

version: "1.0"

commands:
  network:
    phases: ["setup", "test", "teardown"]
    steps:
      # =======================================================================
      # SETUP: Create ephemeral tenant for network tests
      # =======================================================================
      - name: setup_tenant
        phase: setup
        command: "python3 ../scripts/network/setup_tenant.py"
        args:
          - "--region"
          - "{{region}}"
        timeout: 180

      # =======================================================================
      # SETUP: Create shared VNet + subnets
      # =======================================================================
      - name: create_network
        phase: setup
        command: "python3 ../scripts/network/create_network.py"
        args:
          - "--region"
          - "{{region}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 600

      # =======================================================================
      # TEST: GET VirtualNetwork by ID (VpcReadFromInventoryCheck / SDN01-02)
      # =======================================================================
      - name: get_vpc
        phase: test
        command: "python3 ../scripts/network/get_vpc.py"
        args:
          - "--vnet-id"
          - "{{steps.create_network.network_id}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 30

      # =======================================================================
      # TEST: VPC IP config (IPAM02-01)
      # =======================================================================
      - name: vpc_ip_config
        phase: test
        command: "python3 ../scripts/network/vpc_ip_config.py"
        args:
          - "--vnet-id"
          - "{{steps.create_network.network_id}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 30

      # =======================================================================
      # TEST: VPC (VirtualNetwork) CRUD (SDN01-01..04)
      # =======================================================================
      - name: vpc_crud
        phase: test
        command: "python3 ../scripts/network/vpc_crud_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 400

      # =======================================================================
      # TEST: VPC list (SDN01-05)
      # =======================================================================
      - name: list_vpcs
        phase: test
        command: "python3 ../scripts/network/list_vpcs_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
          - "--target-vpc-id"
          - "{{steps.create_network.network_id}}"
        timeout: 300

      # =======================================================================
      # TEST: Subnet assignment (SDN01-06)
      # =======================================================================
      - name: subnet_assignment
        phase: test
        command: "python3 ../scripts/network/subnet_assignment_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
          - "--target-vpc-id"
          - "{{steps.create_network.network_id}}"
          - "--target-subnet-id"
          - "{{steps.create_network.subnets[0].subnet_id}}"
        timeout: 300

      # =======================================================================
      # TEST: Subnet configuration
      # =======================================================================
      - name: subnet_config
        phase: test
        command: "python3 ../scripts/network/subnet_config_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 400

      # =======================================================================
      # TEST: VPC isolation (SDN04-02)
      # =======================================================================
      - name: vpc_isolation
        phase: test
        command: "python3 ../scripts/network/vpc_isolation_test.py"
        args:
          - "--region"
          - "{{region}}"
        timeout: 300

      # =======================================================================
      # TEST: SecurityGroup CRUD (SDN02-01..04)
      # =======================================================================
      - name: sg_crud
        phase: test
        command: "python3 ../scripts/network/sg_crud_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 400

      # =======================================================================
      # TEST: Security blocking (default-deny SG)
      # =======================================================================
      - name: security_blocking
        phase: test
        command: "python3 ../scripts/network/security_blocking_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 400

      # =======================================================================
      # TEST: SG scoping checks (SDN02-05..10)
      # =======================================================================
      - name: sg_workload_scoping
        phase: test
        command: "python3 ../scripts/network/sg_workload_scoping_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 300

      - name: sg_node_scoping
        phase: test
        command: "python3 ../scripts/network/sg_node_scoping_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 300

      - name: sg_subnet_scoping
        phase: test
        command: "python3 ../scripts/network/sg_subnet_scoping_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 300

      - name: sg_service_scoping
        phase: test
        command: "python3 ../scripts/network/sg_service_scoping_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 300

      - name: sg_port_security_policy
        phase: test
        command: "python3 ../scripts/network/sg_port_security_policy_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 300

      # =======================================================================
      # TEST: SG policy propagation timing (SDN02-08)
      # =======================================================================
      - name: sg_policy_propagation
        phase: test
        command: "python3 ../scripts/network/sg_policy_propagation_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 120

      # =======================================================================
      # TEST: BYOIP via ExternalIPPool (NET03-01)
      # =======================================================================
      - name: byoip_test
        phase: test
        command: "python3 ../scripts/network/byoip_test.py"
        args:
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 300

      # =======================================================================
      # TEST: SDN hardware fault logging (SDN09-01)
      # =======================================================================
      - name: sdn_hardware_fault_logging
        phase: test
        command: "python3 ../scripts/network/sdn_hardware_fault_logging.py"
        timeout: 120
        continue_on_failure: true

      # =======================================================================
      # TEST: VPC Flow Logs (SDN09-04)
      # =======================================================================
      - name: flow_logs_test
        phase: test
        command: "python3 ../scripts/network/flow_logs_test.py"
        args:
          - "--region"
          - "{{region}}"
        timeout: 120

      # =======================================================================
      # TEST: SDN filter audit trail (SDN09-03)
      # =======================================================================
      - name: sdn_filter_audit_trail
        phase: test
        command: "python3 ../scripts/network/sdn_filter_audit_trail_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
          - "--vnet-id"
          - "{{steps.create_network.network_id}}"
        timeout: 900

      # =======================================================================
      # TEST: Floating IP (ExternalIP) switch between two instances (SDN05-01)
      # =======================================================================
      - name: floating_ip_test
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/network/floating_ip_test.py"
        args:
          - "--region"
          - "{{region}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 1200

      # =======================================================================
      # SETUP: Launch two BMIs for connectivity / stable-IP / traffic tests
      # (bare_metal capability only)
      # =======================================================================
      - name: launch_bm_instances
        phase: setup
        requires: [bare_metal]
        command: "python3 ../scripts/network/launch_bm_instances.py"
        args:
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
          - "--region"
          - "{{region}}"
        timeout: 1200

      # =======================================================================
      # TEST: Network connectivity (NetworkConnectivityCheck / bare_metal only)
      # =======================================================================
      - name: connectivity_test
        phase: test
        requires: [bare_metal]
        command: "python3 ../scripts/network/connectivity_test.py"
        args:
          - "--external-ip-a"
          - "{{steps.launch_bm_instances.external_ip_a}}"
          - "--external-ip-b"
          - "{{steps.launch_bm_instances.external_ip_b}}"
          - "--instance-a-id"
          - "{{steps.launch_bm_instances.instance_a_id}}"
          - "--instance-b-id"
          - "{{steps.launch_bm_instances.instance_b_id}}"
        timeout: 120

      # =======================================================================
      # TEST: Stable private IP — stop/start BMI-A, verify IP unchanged
      # (StablePrivateIpCheck / SDN11-01 / bare_metal only)
      # =======================================================================
      - name: stable_ip_test
        phase: test
        requires: [bare_metal]
        command: "python3 ../scripts/network/stable_ip_test.py"
        args:
          - "--instance-id"
          - "{{steps.launch_bm_instances.instance_a_id}}"
          - "--ip-before"
          - "{{steps.launch_bm_instances.external_ip_a}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 600

      # =======================================================================
      # TEST: Stable egress IP — SSH into BMI-A, probe outbound IP three times
      # (StableEgressIpCheck / DMS05-01 / bare_metal only)
      # =======================================================================
      - name: stable_egress_ip_test
        phase: test
        requires: [bare_metal]
        command: "python3 ../scripts/network/stable_egress_ip_test.py"
        args:
          - "--external-ip"
          - "{{steps.launch_bm_instances.external_ip_a}}"
          - "--key-file"
          - "{{steps.launch_bm_instances.key_file}}"
        timeout: 120

      # =======================================================================
      # TEST: Traffic flow — ping + curl from BMI-A to BMI-B and internet
      # (TrafficFlowCheck / bare_metal only)
      # =======================================================================
      - name: traffic_validation
        phase: test
        requires: [bare_metal]
        command: "python3 ../scripts/network/traffic_validation_test.py"
        args:
          - "--external-ip-a"
          - "{{steps.launch_bm_instances.external_ip_a}}"
          - "--bmh-ip-b"
          - "{{steps.launch_bm_instances.bmh_ip_b}}"
          - "--key-file"
          - "{{steps.launch_bm_instances.key_file}}"
        timeout: 120

      # =======================================================================
      # TEARDOWN: Remove BMIs spun up for connectivity tests (bare_metal only)
      # =======================================================================
      - name: teardown_bm_instances
        phase: teardown
        requires: [bare_metal]
        continue_on_failure: true
        command: "python3 ../scripts/network/teardown_bm_instances.py"
        args:
          - "--instance-a-id"
          - "{{steps.launch_bm_instances.instance_a_id}}"
          - "--instance-b-id"
          - "{{steps.launch_bm_instances.instance_b_id}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 1200

      # =======================================================================
      # TEARDOWN: Cleanup ephemeral tenant and network resources
      # =======================================================================
      - name: teardown
        phase: teardown
        command: "python3 ../scripts/network/teardown.py"
        args:
          - "--region"
          - "{{region}}"
          - "--tenant-name"
          - "{{steps.setup_tenant.tenant_name}}"
          - "--tenant-namespace"
          - "{{steps.setup_tenant.tenant_namespace}}"
        timeout: 120
        output_schema: teardown

tests:
  cluster_name: "osac-network-validation"
  description: "OSAC network: VNet CRUD, subnets, SecurityGroup lifecycle, tenant isolation"
  settings:
    region: "osac-default"

  validations:
    sdn:
      checks:
        FloatingIpCheck:
          max_switch_seconds: 300

    network:
      checks:
        VpcIpConfigCheck:
          # OSAC assigns external IPs per-instance via ExternalIPAttachment,
          # not at the subnet level — subnet-level auto_assign_public_ip doesn't apply.
          auto_assign_ip_mode: "instance"

  exclude:
    labels: ["ssh"]
