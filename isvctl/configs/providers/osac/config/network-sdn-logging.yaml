# OSAC SDN Logging Validation
#
# Validates SDN hardware fault logging via OCP Prometheus/AlertManager.
#
# Implemented checks:
#   SDN09-01: SdnHardwareFaultLoggingCheck — network fault event logging
#
# Prerequisites:
#   - OCP cluster with openshift-monitoring namespace
#   - kubectl/oc with cluster-admin access
#
# Usage:
#   ISVTEST_INCLUDE_UNRELEASED=1 \
#   uv run isvctl test run \
#     -f isvctl/configs/providers/osac/config/network-sdn-logging.yaml

import:
  - ../../../suites/network.yaml

version: "1.0"

commands:
  network:
    phases: ["test"]
    steps:
      - name: sdn_hardware_fault_logging
        phase: test
        command: "python3 ../scripts/network/sdn_hardware_fault_logging.py"
        timeout: 120

tests:
  cluster_name: "osac-network-sdn-logging"
  description: "OSAC network: SDN hardware fault logging via OCP monitoring"

  settings:
    region: "osac-default"

  exclude:
    labels:
      - "gpu"
      - "workload"
      - "slow"
