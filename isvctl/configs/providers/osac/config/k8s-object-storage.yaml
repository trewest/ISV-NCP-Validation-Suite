# OSAC Object Storage Validation — MinIO S3 CRUD
#
# Validates S3 object lifecycle (DATASVC01-01) via MinIO deployed on the cluster.
# MinIO and mc-client pod must be pre-deployed (see deploy-test-services.sh).
#
# Prerequisites:
#   - MinIO deployment in minio namespace
#   - mc-client pod with alias configured
#
# Environment Variables:
#   MINIO_NS    — MinIO namespace (default: minio)
#   MC_POD      — mc client pod name (default: mc-client)
#
# Usage:
#   KUBECONFIG=~/.kube/osac-gpu-oci11.kubeconfig \
#     uv run isvctl test run -f isvctl/configs/providers/osac/config/k8s-object-storage.yaml

import:
  - ../../../suites/control-plane.yaml

version: "1.0"

commands:
  control_plane:
    phases: ["setup", "test", "teardown"]
    steps:
      - name: s3_object_lifecycle
        phase: test
        command: "python3 ../scripts/control-plane/s3_object_lifecycle.py"
        timeout: 120

tests:
  cluster_name: "osac-object-storage-validation"
  description: "OSAC object storage: MinIO S3 CRUD lifecycle"

  settings:
    region: "osac-default"
    services: "minio"
