# OSAC HSS Storage Validation — Root Squash
#
# Validates NFS root_squash toggle (HSS13-01) on the in-cluster NFS server.
# The NFS server must already be deployed in nfs-system namespace
# (see deploy-test-services.sh or prior session setup).
#
# Prerequisites:
#   - NFS server running in nfs-system namespace with /exports share
#   - kubectl access to the cluster
#
# Environment Variables:
#   NFS_SERVER_NS       — NFS server namespace (default: nfs-system)
#   NFS_SERVER_DEPLOY   — NFS server deployment ref (default: deployment/nfs-server)
#   NFS_EXPORT_PATH     — NFS export path (default: /exports)
#   NFS_SERVER_SVC      — NFS server K8s service FQDN
#
# Usage:
#   KUBECONFIG=~/.kube/osac-gpu-oci11.kubeconfig \
#     uv run isvctl test run -f isvctl/configs/providers/osac/config/k8s-hss-storage.yaml

import:
  - ../../../suites/storage.yaml

version: "1.0"

commands:
  storage:
    phases: ["setup", "test", "teardown"]
    steps:
      - name: root_squash
        phase: test
        command: "python3 ../scripts/storage/root_squash.py"
        timeout: 480

tests:
  cluster_name: "osac-hss-storage-validation"
  description: "OSAC HSS storage: NFS root-squash toggle"

  settings:
    region: "osac-default"
