# OSAC Phase 2 Storage Validation — Flock Mount + Home Directory
#
# Validates:
#   HSS14-01 — flock mount (exclusive, shared, contention)
#   DIR01-01 — filesystem quotas (configure, update, enforce)
#   DIR01-02 — per-UID/GID usage accounting
#   DIR02-01 — NFSv4 shared-storage availability
#
# Prerequisites:
#   - NFS server running in nfs-system namespace with /exports share
#   - kubectl access to the cluster
#
# Environment Variables:
#   NFS_SERVER_NS       — NFS server namespace (default: nfs-system)
#   NFS_SERVER_DEPLOY   — NFS server deployment ref (default: deployment/nfs-server)
#   NFS_EXPORT_PATH     — NFS export path (default: /exports)
#
# Usage:
#   KUBECONFIG=~/.kube/osac-gpu-oci11.kubeconfig \
#     uv run isvctl test run -f isvctl/configs/providers/osac/config/k8s-phase2-storage.yaml

import:
  - ../../../suites/storage.yaml

version: "1.0"

commands:
  storage:
    phases: ["setup", "test", "teardown"]
    steps:
      - name: flock_mount
        phase: test
        command: "python3 ../scripts/storage/flock_mount.py"
        timeout: 480
      - name: home_directory_storage
        phase: test
        command: "python3 ../scripts/storage/home_directory_storage.py"
        timeout: 600

tests:
  cluster_name: "osac-phase2-storage-validation"
  description: "OSAC Phase 2: flock mount + home directory storage"

  settings:
    region: "osac-default"
