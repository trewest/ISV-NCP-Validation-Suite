# OSAC Image Registry — Custom OS Image Upload
#
# Uploads a containerDisk image to OCP's internal registry via ImageStream
# and verifies the image ID, storage bucket (namespace), and disk layer IDs.
#
# Implemented checks:
#   BOOT01-01: CustomOsImageUploadedCheck — image uploaded with disk IDs
#
# Usage:
#   ISVTEST_INCLUDE_UNRELEASED=1 \
#   uv run isvctl test run -f isvctl/configs/providers/osac/config/image-upload.yaml

import:
  - ../../../suites/image-registry.yaml

version: "1.0"

commands:
  image_registry:
    phases: ["test"]
    steps:
      - name: upload_image
        phase: test
        command: "python3 ../scripts/image_registry/upload_image_osac.py"
        timeout: 180

tests:
  cluster_name: "osac-image-upload"
  description: "OSAC image registry: custom OS image upload"

  settings:
    region: "osac-default"

  exclude:
    labels:
      - "gpu"
      - "workload"
      - "slow"
