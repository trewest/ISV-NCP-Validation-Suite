# Read-only, site-wide NICo maintenance and repair-history observability.
# This configuration does not report, release, replace, or repair machines.

import:
  - ../../../suites/bare_metal.yaml

version: "1.0"

commands:
  bare_metal:
    phases: ["test"]
    steps:
      - name: query_maintenance_events
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/breakfix/query_maintenance_events.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      - name: query_repair_history
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/breakfix/query_repair_history.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

tests:
  cluster_name: "nico-nvl72-maintenance"
  description: "NICo NVL72 read-only maintenance and repair-history observability"

  settings:
    org: "{{env.NICO_ORGANIZATION}}"
    site_id: "{{env.NICO_SITE_ID}}"
    nico_api_base: "{{env.NICO_API_BASE}}"

  validations:
    maintenance_events:
      step: query_maintenance_events
      checks:
        MaintenanceEventsCheck: {}

    repair_history:
      step: query_repair_history
      checks:
        RepairHistoryCheck: {}
