# Read-only, site-wide NICo hardware-attestation validation for NVL72.
# The admin CLI endpoint and certificate paths are supplied through:
# NICO_ADMIN_CLI, NICO_CARBIDE_URL, NICO_FORGE_ROOT_CA_PATH,
# NICO_CLIENT_KEY_PATH, and NICO_CLIENT_CERT_PATH.

import:
  - ../../../suites/bare_metal.yaml

version: "1.0"

commands:
  bare_metal:
    phases: ["test"]
    steps:
      - name: query_attestation
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/attestation/query_attestation.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

tests:
  cluster_name: "nico-nvl72-attestation"
  description: "NICo NVL72 read-only hardware-attestation validation"

  settings:
    org: "{{env.NICO_ORGANIZATION}}"
    site_id: "{{env.NICO_SITE_ID}}"
    nico_api_base: "{{env.NICO_API_BASE}}"

  validations:
    nonce_attestation:
      step: query_attestation
      checks:
        BmNonceAttestationCheck: {}

    firmware_attestation:
      step: query_attestation
      checks:
        BmFirmwareAttestationCheck: {}
