# Read-only, site-wide NICo specified-key access validation for NVL72.
# --no-provision prevents the provider script from creating or removing keys.

import:
  - ../../../suites/bare_metal.yaml

version: "1.0"

commands:
  bare_metal:
    phases: ["test"]
    steps:
      - name: query_key_access
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/auth/query_key_access.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
          - "--no-provision"
        timeout: 120

tests:
  cluster_name: "nico-nvl72-key-access"
  description: "NICo NVL72 read-only specified-key access validation"

  settings:
    org: "{{env.NICO_ORGANIZATION}}"
    site_id: "{{env.NICO_SITE_ID}}"
    nico_api_base: "{{env.NICO_API_BASE}}"

  validations:
    key_access:
      step: query_key_access
      checks:
        BmComponentKeyAccessCheck:
          min_accessible_targets: 1
