# Read-only, site-wide NICo InfiniBand validation for NVL72.
# Optional UFM evidence is supplied through UFM_ADDRESS/UFM_TOKEN or the UFM
# username/password environment variables; no credentials are stored here.

import:
  - ../../../suites/bare_metal.yaml

version: "1.0"

commands:
  bare_metal:
    phases: ["test"]
    steps:
      - name: query_ib_tenant_isolation
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/infiniband/query_ib_tenant_isolation.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      - name: query_ib_keys
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/infiniband/query_ib_keys.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

tests:
  cluster_name: "nico-nvl72-infiniband"
  description: "NICo NVL72 read-only InfiniBand validation"

  settings:
    org: "{{env.NICO_ORGANIZATION}}"
    site_id: "{{env.NICO_SITE_ID}}"
    nico_api_base: "{{env.NICO_API_BASE}}"

  validations:
    ib_tenant_isolation:
      step: query_ib_tenant_isolation
      checks:
        IbTenantIsolationCheck:
          min_partitions: 1

    ib_keys_configured:
      step: query_ib_keys
      checks:
        IbKeysConfiguredCheck:
          required_keys: ["p_key", "management_key"]
