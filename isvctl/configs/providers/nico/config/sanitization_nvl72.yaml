# Opt-in, read-only NICo GPU-memory sanitization validation.
#
# This config deliberately wires only the lifecycle-history probe. It does not
# include the broad NICo bare-metal config, whose key-access step may provision
# a temporary key when run without --no-provision.

import:
  - ../../../suites/bare_metal.yaml

version: "1.0"

commands:
  bare_metal:
    phases: ["test"]
    steps:
      - name: query_sanitization
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/sanitization/query_sanitization.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

tests:
  cluster_name: "nico-nvl72-gpu-memory-sanitization"
  description: "NICo NVL72 read-only GPU-memory sanitization lifecycle validation"

  settings:
    org: "{{env.NICO_ORGANIZATION}}"
    site_id: "{{env.NICO_SITE_ID}}"
    nico_api_base: "{{env.NICO_API_BASE}}"

  validations:
    gpu_memory_sanitization:
      step: query_sanitization
      checks:
        BmGpuMemorySanitizationCheck: {}
