# Explicitly armed disposable-instance lifecycle validation.
# Required runtime inputs:
#   NICO_TEST_TENANT_ID
#   NICO_TEST_VPC_ID
#   NICO_TEST_MACHINE_ID or NICO_TEST_INSTANCE_TYPE_ID
#   NICO_TEST_VPC_PREFIX_ID, NICO_TEST_INTERFACES_JSON, or NICO_TEST_AUTO_NETWORK=1
# Required mutation guards:
#   NICO_ALLOW_DISPOSABLE_INSTANCE_CREATE=1
#   NICO_ALLOW_RELEASE_FOR_REPAIR=1

import:
  - ../../../suites/bare_metal.yaml

version: "1.0"

commands:
  bare_metal:
    phases: ["setup", "test", "teardown"]
    steps:
      - name: create_disposable_instance
        phase: setup
        continue_on_failure: true
        command: "python3 ../scripts/instance/create_disposable_instance.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 900

      - name: return_node_maintenance
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/breakfix/return_node_maintenance.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
          - "--instance-id={{steps.create_disposable_instance.instance_id}}"
        timeout: 900

      - name: cleanup_disposable_instance
        phase: teardown
        continue_on_failure: true
        command: "python3 ../scripts/instance/cleanup_disposable_instance.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
          - "--instance-id={{steps.create_disposable_instance.instance_id}}"
        timeout: 900

tests:
  cluster_name: "nico-nvl72-disposable-return"
  description: "NICo NVL72 disposable ReturnNodeMaintenanceCheck; requires NICO_ALLOW_DISPOSABLE_INSTANCE_CREATE=1 and NICO_ALLOW_RELEASE_FOR_REPAIR=1"

  settings:
    org: "{{env.NICO_ORGANIZATION}}"
    site_id: "{{env.NICO_SITE_ID}}"
    nico_api_base: "{{env.NICO_API_BASE}}"

  validations:
    return_node_maintenance:
      step: return_node_maintenance
      checks:
        ReturnNodeMaintenanceCheck: {}
