# Read-only, site-wide NICo hardware-ingestion validation for NVL72.

import:
  - ../../../suites/bare_metal.yaml

version: "1.0"

commands:
  bare_metal:
    phases: ["test"]
    steps:
      - name: verify_ingestion
        phase: test
        continue_on_failure: true
        command: "python3 ../scripts/hardware_ingestion/verify_ingestion.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

tests:
  cluster_name: "nico-nvl72-ingestion"
  description: "NICo NVL72 read-only hardware-ingestion validation"

  settings:
    org: "{{env.NICO_ORGANIZATION}}"
    site_id: "{{env.NICO_SITE_ID}}"
    nico_api_base: "{{env.NICO_API_BASE}}"

  validations:
    ingestion_check:
      step: verify_ingestion
      checks:
        HardwareIngestionCheck:
          min_machines: 1
          expected_status: ["Ready", "InUse"]
          require_healthy: true
